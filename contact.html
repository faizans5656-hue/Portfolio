<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Faizan</title>
  <meta name="description" content="Contact Faizan — professional inquiries and networking.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-header">
    <div class="container nav">
      <div class="brand">
        <img src="assets/img/profile.jpg" alt="Faizan headshot" width="42" height="42">
        <div>
          <div class="title">Faizan</div>
          <div class="subtitle">Data Analyst</div>
        </div>
      </div>
      <nav aria-label="Primary">
        <button class="menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="nav-links">Menu</button>
        <div class="nav-links" id="nav-links" data-nav-links>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="experience.html">Experience</a>
          <a href="skills.html">Skills</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html">Contact</a>
        </div>
      </nav>
      <div class="nav-cta">
        <a class="btn btn-ghost" href="Faizan_DA_Resume00.docx" download>Resume</a>
        <a class="btn btn-primary" href="contact.html">Hire Me</a>
      </div>
    </div>
  </header>

  <main id="main" class="container section">
    <h2 data-reveal data-reveal-order="0">Contact</h2>
    <p class="subhead" data-reveal data-reveal-order="1">For opportunities and collaborations.</p>

    <form class="contact-form card" name="contact" method="post" data-netlify="true" data-reveal data-reveal-order="2">
      <input type="hidden" name="form-name" value="contact">
      <label>
        <span class="sr-only">Name</span>
        <input class="input" type="text" name="name" placeholder="Your name" required>
      </label>
      <div class="error" data-error="name"></div>

      <label>
        <span class="sr-only">Email</span>
        <input class="input" type="email" name="email" placeholder="you@example.com" required>
      </label>
      <div class="error" data-error="email"></div>

      <label>
        <span class="sr-only">Message</span>
        <textarea class="input" name="message" placeholder="How can I help?" required></textarea>
      </label>
      <div class="error" data-error="message"></div>

      <div class="help">I aim to reply within 1–2 business days.</div>
      <div>
        <button class="btn btn-accent" type="submit">Send Message</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container inner">
      <div>© <span id="year"></span> Faizan. All rights reserved.</div>
      <div class="social">
        <a href="https://www.linkedin.com/" target="_blank" rel="noopener">LinkedIn</a>
        <span class="muted">·</span>
        <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
        <span class="muted">·</span>
        <a href="mailto:email@example.com">Email</a>
      </div>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
